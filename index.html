<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="PWA theo dõi giá sản phẩm Shopee mỗi ngày." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Shopee Watch" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="/styles-v2.css" />
  <link rel="stylesheet" href="/search-v3.css" />
  <title>S. — Shopee Price Watch</title>
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Trang chủ">S.</a>
      <div class="top-actions">
        <button id="installButton" class="text-button" hidden>Cài PWA</button>
        <button id="bellButton" class="bell-button" type="button" aria-label="Thông báo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
          <span id="bellBadge" class="bell-badge" hidden>0</span>
        </button>
      </div>
    </header>

    <main>
      <section class="hero">
        <h1>Theo dõi giá.<br />Không cần canh.</h1>
        <form id="addProductForm" class="track-box">
          <span class="track-glyph" aria-hidden="true">⌕</span>
          <label class="sr-only" for="productUrl">Tên sản phẩm hoặc link Shopee</label>
          <input id="productUrl" name="url" type="text" inputmode="search" autocomplete="off" placeholder="Tên sản phẩm hoặc link Shopee…" required />
          <button id="addButton" type="submit">Tìm</button>
        </form>
        <p id="formMessage" class="form-message" role="status"></p>
      </section>

      <section class="dashboard-shell">
        <div class="section-head">
          <h2>Sản phẩm</h2>
          <button id="refreshButton" class="outline-button" type="button">Làm mới</button>
        </div>
        <div class="stats-grid" aria-label="Tổng quan">
          <article class="stat-card"><span>Đang theo dõi</span><strong id="totalProducts">—</strong></article>
          <article class="stat-card"><span>Đang giảm</span><strong id="discountedProducts">—</strong></article>
          <article class="stat-card"><span>Cập nhật gần nhất</span><strong id="lastUpdated">—</strong></article>
        </div>
        <span id="loadingState" hidden></span>
        <div id="emptyState" class="empty-state" hidden><span class="empty-mark">S.</span><h3>Chưa có sản phẩm.</h3></div>
        <div id="productList" class="product-list"></div>
      </section>
    </main>
  </div>

  <dialog id="notificationDialog" class="notification-dialog">
    <section class="notification-card">
      <div class="notification-head">
        <h2>Lịch sử</h2>
        <form method="dialog"><button class="icon-button" aria-label="Đóng" type="submit">×</button></form>
      </div>
      <div class="notification-toolbar">
        <button id="notificationButton" class="pill-button" type="button">Bật thông báo trên thiết bị này</button>
        <button id="testNotificationButton" class="outline-button" type="button">Gửi thử</button>
        <p id="notificationMessage" class="form-message" role="status"></p>
      </div>
      <div id="notificationEmpty" class="notification-empty" hidden><strong>Chưa có thông báo.</strong></div>
      <div id="notificationList" class="notification-list"></div>
    </section>
  </dialog>

  <template id="productTemplate">
    <article class="product-card">
      <div class="product-media"><img class="product-image" alt="" loading="lazy" /><div class="product-image-fallback">S.</div></div>
      <div class="product-main">
        <div class="product-topline"><span class="status-chip">ĐANG THEO DÕI</span><span class="check-time">—</span></div>
        <h3 class="product-name">Sản phẩm Shopee</h3>
        <div class="price-row"><strong class="current-price">—</strong><span class="drop-badge" hidden></span></div>
        <dl class="price-facts">
          <div><dt>Ban đầu</dt><dd class="baseline-price">—</dd></div>
          <div><dt>Thấp nhất</dt><dd class="lowest-price">—</dd></div>
          <div><dt>Trạng thái</dt><dd class="price-status">—</dd></div>
        </dl>
        <p class="product-error" hidden></p>
        <div class="product-actions">
          <button class="check-button outline-button" type="button">Kiểm tra ngay</button>
          <a class="shop-link outline-button" target="_blank" rel="noreferrer">Mở Shopee</a>
          <button class="delete-button text-button danger" type="button">Xoá</button>
        </div>
      </div>
    </article>
  </template>

  <script src="/app-v2.js" defer></script>
  <script src="/search-v3.js" defer></script>
  <script src="/track-daily.js" defer></script>
</body>
</html>
